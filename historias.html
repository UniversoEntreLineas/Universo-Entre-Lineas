
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca | Universo Entre Líneas</title>

<style>
:root {
  --paper: #f7f1e8;
  --white: #fffdf9;
  --wine: #713847;
  --dark: #4d2934;
  --ink: #30272c;
  --muted: #81736e;
  --line: #e5d9cc;
  --gold: #b69a70;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, serif;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  padding: 30px 15px;
  text-align: center;
  background: var(--white);
}

.brand {
  color: var(--wine);
  font-size: 35px;
}

.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font: 10px Arial, sans-serif;
  letter-spacing: 3px;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 28px;
  padding: 16px;
  background: var(--white);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font: 13px Arial, sans-serif;
}

nav a:hover {
  color: var(--wine);
}

.hero {
  padding: 65px 20px;
  text-align: center;
  background: var(--dark);
  color: var(--white);
}

.hero small {
  color: #d8c3ae;
  letter-spacing: 3px;
  font: 10px Arial, sans-serif;
}

.hero h1 {
  margin: 15px 0;
  font-size: 45px;
  font-weight: normal;
}

.hero p {
  color: #e6d9d0;
  font-size: 15px;
}

main {
  width: min(1100px, 92%);
  margin: auto;
  padding: 45px 0 70px;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink);
  font: 13px Arial, sans-serif;
}

.search button {
  padding: 0 22px;
  border: none;
  background: var(--wine);
  color: white;
  cursor: pointer;
}

.layout {
  display: grid;
  grid-template-columns: 230px 1fr;
  gap: 28px;
}

.filters {
  padding: 8px 4px 18px 0;
  background: transparent;
  border: none;
  align-self: start;
}

.filters h2 {
  margin: 0 0 25px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
  color: var(--wine);
  font-size: 25px;
  font-weight: normal;
}

.filter-group {
  margin-bottom: 25px;
}

.filter-group label {
  display: block;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 14px;
}

.filter-group select {
  margin-bottom: 4px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 12px 5px;
  outline-color: var(--gold);
}

.reset {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--wine);
  background: transparent;
  color: var(--wine);
  cursor: pointer;
}

.reset:hover {
  background: var(--wine);
  color: white;
}

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.results-header h2 {
  color: var(--wine);
  font-weight: normal;
  font-size: 25px;
}

.count {
  color: var(--muted);
  font: 12px Arial, sans-serif;
}

.books {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.book {
  display: grid;
  grid-template-columns: 105px 1fr;
  gap: 15px;
  padding: 16px;
  background: var(--white);
  border: 1px solid var(--line);
}

.cover {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: #e9dfd3;
  color: var(--wine);
  text-align: center;
  font-size: 19px;
  font-style: italic;
}

.book small {
  color: var(--gold);
  font: 10px Arial, sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.book h3 {
  margin: 9px 0 5px;
  color: var(--wine);
  font-size: 20px;
  font-weight: normal;
}

.book h3 a:hover {
  text-decoration: underline;
}

.author {
  color: var(--muted);
  font: 12px Arial, sans-serif;
}

.description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.tag {
  padding: 5px 7px;
  background: #f0e8df;
  color: var(--wine);
  font: 10px Arial, sans-serif;
}

.empty {
  grid-column: 1 / -1;
  padding: 40px;
  background: var(--white);
  text-align: center;
  color: var(--muted);
}

footer {
  padding: 30px;
  background: var(--ink);
  color: #e9dfd5;
  text-align: center;
  font-size: 13px;
}

@media(max-width: 750px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .books {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 450px) {
  .book {
    grid-template-columns: 85px 1fr;
  }

  .hero h1 {
    font-size: 35px;
  }

  nav {
    gap: 15px;
  }

  .search {
    flex-direction: column;
  }

  .search button {
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="title">UNIVERSO ENTRE LÍNEAS</div>
  <div class="subtitle">UN LUGAR PARA CADA HISTORIA</div>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="historias.html">Biblioteca</a>
  <a href="categorias.html">Categorías</a>
  <a href="comunidad.html">Comunidad</a>
  <a href="destacadas.html">Destacadas</a>
  <a href="nosotros.html">Nosotros</a>
</nav>

<div class="hero">
  <h1>La biblioteca</h1>
  <p>Encuentra una historia que merezca quedarse contigo.</p>
</div>

<main>

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="Buscar por título o autor..."
    >
    <button onclick="filterBooks()">Buscar</button>
  </div>

  <div class="layout">

    <aside class="filters">
      <h2>Explorar</h2>

      <div class="filter-group">
        <label for="type">Tipo de obra</label>
        <select id="type">
          <option value="">Todos</option>
          <option value="Original">Original</option>
          <option value="Fanfiction">Fanfiction</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="genre">Género</label>

        <select id="genre">
          <option value="">Todos los géneros</option>

          <optgroup label="Romance">
            <option value="Romance">Romance</option>
            <option value="Romance contemporáneo">Romance contemporáneo</option>
            <option value="Romance histórico">Romance histórico</option>
            <option value="Romance paranormal">Romance paranormal</option>
            <option value="Romance oscuro">Romance oscuro</option>
            <option value="Romance juvenil">Romance juvenil</option>
            <option value="Romance fantástico">Romance fantástico</option>
          </optgroup>

          <optgroup label="Fantasía">
            <option value="Fantasía">Fantasía</option>
            <option value="Fantasía épica">Fantasía épica</option>
            <option value="Fantasía urbana">Fantasía urbana</option>
            <option value="Fantasía oscura">Fantasía oscura</option>
            <option value="Alta fantasía">Alta fantasía</option>
            <option value="Baja fantasía">Baja fantasía</option>
            <option value="Cuentos de hadas">Cuentos de hadas</option>
          </optgroup>

          <optgroup label="Ciencia ficción">
            <option value="Ciencia ficción">Ciencia ficción</option>
            <option value="Ciencia ficción espacial">Ciencia ficción espacial</option>
            <option value="Cyberpunk">Cyberpunk</option>
            <option value="Steampunk">Steampunk</option>
            <option value="Distopía">Distopía</option>
            <option value="Utopía">Utopía</option>
          </optgroup>

          <optgroup label="Misterio y crimen">
            <option value="Misterio">Misterio</option>
            <option value="Policial">Policial</option>
            <option value="Novela negra">Novela negra</option>
            <option value="Thriller">Thriller</option>
            <option value="Suspense">Suspense</option>
            <option value="Crimen y detectives">Crimen y detectives</option>
          </optgroup>

          <optgroup label="Terror y sobrenatural">
            <option value="Terror">Terror</option>
            <option value="Terror psicológico">Terror psicológico</option>
            <option value="Terror sobrenatural">Terror sobrenatural</option>
            <option value="Gótico">Gótico</option>
            <option value="Paranormal">Paranormal</option>
            <option value="Sobrenatural">Sobrenatural</option>
          </optgroup>

          <optgroup label="Drama y emociones">
            <option value="Drama">Drama</option>
            <option value="Tragedia">Tragedia</option>
            <option value="Drama psicológico">Drama psicológico</option>
            <option value="Melodrama">Melodrama</option>
            <option value="Vida cotidiana">Vida cotidiana</option>
          </optgroup>

          <optgroup label="Aventura y acción">
            <option value="Aventura">Aventura</option>
            <option value="Acción">Acción</option>
            <option value="Supervivencia">Supervivencia</option>
            <option value="Viajes">Viajes</option>
            <option value="Artes marciales">Artes marciales</option>
          </optgroup>

          <optgroup label="Historia y mitología">
            <option value="Histórico">Histórico</option>
            <option value="Mitología">Mitología</option>
            <option value="Retelling mitológico">Retelling mitológico</option>
            <option value="Biográfico">Biográfico</option>
          </optgroup>

          <optgroup label="Humor y juventud">
            <option value="Comedia">Comedia</option>
            <option value="Humor">Humor</option>
            <option value="Sátira">Sátira</option>
            <option value="Juvenil">Juvenil</option>
            <option value="Coming of Age">Coming of Age (crecimiento personal)</option>
          </optgroup>

          <optgroup label="Literatura y otros">
            <option value="Poesía">Poesía</option>
            <option value="Cuento">Cuento</option>
            <option value="Novela">Novela</option>
            <option value="Fábula">Fábula</option>
            <option value="Erótico">Erótico</option>
            <option value="Experimental">Experimental</option>
          </optgroup>

        </select>
      </div>

      <div class="filter-group">
        <label for="status">Estado</label>
        <select id="status">
          <option value="">Todos</option>
          <option value="En curso">En curso</option>
          <option value="Completa">Completa</option>
        </select>
      </div>

      <button class="reset" onclick="resetFilters()">
        Limpiar filtros
      </button>
    </aside>

    <section>
      <div class="results-header">
        <h2>Catálogo</h2>
        <span class="count" id="count"></span>
      </div>

      <div class="books" id="books"></div>
    </section>

  </div>
</main>

<footer>
  Universo Entre Líneas
  <p>Un lugar para cada historia.</p>
</footer>

<script>

// ======================================
// HISTORIAS DE EJEMPLO
// ======================================

const stories = [
  {
    title: "Donde mueren las estrellas",
    author: "Autora de ejemplo",
    type: "Original",
    mainGenre: "Drama",
    secondaryGenres: ["Romance", "Tragedia"],
    status: "En curso",
    description: "Hay despedidas que parecen escritas mucho antes de suceder.",
    tags: ["Estrellas", "Emocional"]
  },
  {
    title: "El jardín de los secretos",
    author: "Escritor de ejemplo",
    type: "Original",
    mainGenre: "Misterio",
    secondaryGenres: ["Thriller", "Suspense"],
    status: "Completa",
    description: "Una casa antigua guarda secretos que nadie quiere recordar.",
    tags: ["Secretos", "Suspenso"]
  },
  {
    title: "El reino olvidado",
    author: "Autora de ejemplo",
    type: "Original",
    mainGenre: "Fantasía",
    secondaryGenres: ["Aventura", "Mitología"],
    status: "En curso",
    description: "Un reino desaparecido y una promesa que aún sigue vigente.",
    tags: ["Magia", "Aventura"]
  },
  {
    title: "Después de medianoche",
    author: "Escritor de ejemplo",
    type: "Fanfiction",
    mainGenre: "Romance",
    secondaryGenres: ["Juvenil", "Drama"],
    status: "Completa",
    description: "Una historia alternativa en un universo conocido.",
    tags: ["Romance", "Alternativo"]
  },
  {
    title: "La última habitación",
    author: "Autora de ejemplo",
    type: "Original",
    mainGenre: "Terror",
    secondaryGenres: ["Terror psicológico", "Suspense"],
    status: "En curso",
    description: "Nadie debería abrir la puerta del último pasillo.",
    tags: ["Oscuro", "Suspenso"]
  },
  {
    title: "Horizonte de ceniza",
    author: "Escritor de ejemplo",
    type: "Original",
    mainGenre: "Ciencia ficción",
    secondaryGenres: ["Distopía", "Supervivencia"],
    status: "Completa",
    description: "El futuro de la humanidad comienza con una decisión.",
    tags: ["Futuro", "Tecnología"]
  }
];


// ======================================
// ELEMENTOS DE LA PÁGINA
// ======================================

const books = document.getElementById("books");
const count = document.getElementById("count");


// ======================================
// MOSTRAR LAS HISTORIAS
// ======================================

function renderBooks(list) {
  books.innerHTML = "";

  count.textContent = list.length +
    (list.length === 1 ? " historia" : " historias");

  if (list.length === 0) {
    books.innerHTML =
      '<div class="empty">No encontramos historias con esos criterios.</div>';
    return;
  }

  list.forEach(story => {
    const article = document.createElement("article");
    article.className = "book";

    const cover = document.createElement("div");
    cover.className = "cover";
    cover.textContent = story.title;

    const content = document.createElement("div");

    const type = document.createElement("small");
    type.textContent = story.type;

    const title = document.createElement("h3");
    const link = document.createElement("a");

    link.href = "historia.html";
    link.textContent = story.title;

    title.appendChild(link);

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = "Por " + story.author;

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = story.description;

    // Mostrar género principal, secundarios,
    // estado y etiquetas de la historia.

    const tags = document.createElement("div");
    tags.className = "tags";

    [
      story.mainGenre,
      ...story.secondaryGenres,
      story.status,
      ...story.tags
    ].forEach(value => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = value;
      tags.appendChild(tag);
    });

    content.append(type, title, author, description, tags);
    article.append(cover, content);
    books.appendChild(article);
  });
}


// ======================================
// FILTRAR HISTORIAS
// ======================================

function filterBooks() {
  const query = document.getElementById("search")
    .value.toLowerCase().trim();

  const type = document.getElementById("type").value;
  const genre = document.getElementById("genre").value;
  const status = document.getElementById("status").value;

  const filtered = stories.filter(story => {

    const matchesQuery =
      story.title.toLowerCase().includes(query) ||
      story.author.toLowerCase().includes(query);

    // Reunir el género principal y los secundarios.
    const allGenres = [
      story.mainGenre,
      ...story.secondaryGenres
    ];

    // Una historia aparece si coincide con cualquiera
    // de sus géneros, no solamente con el principal.
    const matchesGenre =
      !genre || allGenres.includes(genre);

    return matchesQuery &&
      (!type || story.type === type) &&
      matchesGenre &&
      (!status || story.status === status);
  });

  renderBooks(filtered);
}


// ======================================
// LIMPIAR FILTROS
// ======================================

function resetFilters() {
  document.getElementById("search").value = "";
  document.getElementById("type").value = "";
  document.getElementById("genre").value = "";
  document.getElementById("status").value = "";

  filterBooks();
}


// ======================================
// ACTIVAR LOS FILTROS
// ======================================

["search", "type", "genre", "status"].forEach(id => {
  document.getElementById(id).addEventListener("input", filterBooks);
});


// ======================================
// LEER EL GÉNERO DESDE LA DIRECCIÓN WEB
// ======================================

const parameters = new URLSearchParams(window.location.search);
const selectedGenre = parameters.get("genero");

if (selectedGenre) {
  const genreSelect = document.getElementById("genre");

  const matchingOption = Array.from(genreSelect.options).find(option =>
    option.value.toLowerCase() === selectedGenre.trim().toLowerCase() ||
    option.textContent.trim().toLowerCase() === selectedGenre.trim().toLowerCase()
  );

  if (matchingOption) {
    genreSelect.value = matchingOption.value;
  }
}


// ======================================
// MOSTRAR EL CATÁLOGO INICIAL
// ======================================

filterBooks();

</script>

</body>
</html>
