
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca | Universo Entre Líneas</title>

<style>
:root {
  --paper: #f7f1e8;
  --white: #fffdf9;
  --wine: #713847;
  --dark: #4d2934;
  --ink: #30272c;
  --muted: #81736e;
  --line: #e5d9cc;
  --gold: #b69a70;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* CABECERA Y NAVEGACIÓN */

.site-header {
  position: relative;
  padding: 45px 15px 0;
  background: var(--dark);
}

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
  padding: 10px 16px;
  background: var(--dark);
  color: var(--white);
  font: 13px Arial, sans-serif;
}

nav a {
  color: var(--white);
  transition: color .2s;
}

nav a:hover {
  color: #d8c3ae;
}

/* ACCESO A LA CUENTA */

.account-area {
  position: absolute;
  top: 12px;
  right: 25px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  font: 12px Arial, sans-serif;
  visibility: hidden;
}

.account-link {
  color: var(--white);
  font-weight: bold;
}

.account-register {
  padding: 7px 11px;
  border: 1px solid #d8c3ae;
}

.account-register:hover {
  background: var(--white);
  color: var(--dark);
}

.profile-link {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--white);
  font-weight: bold;
}

.profile-thumbnail {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--gold);
  background: #e9dfd3;
}

.profile-initial {
  width: 32px;
  height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--paper);
  color: var(--wine);
  font: bold 14px Arial, sans-serif;
}

#user-account {
  display: none;
}

.hero {
  padding: 25px 20px 28px;
  text-align: center;
  background: var(--dark);
  color: var(--white);
}

.hero h1 {
  margin: 0 0 8px;
  font-size: 36px;
  font-weight: normal;
}

.hero p {
  margin: 0;
  color: #e6d9d0;
  font-size: 14px;
}

main {
  width: min(1100px, 92%);
  margin: auto;
  padding: 45px 0 70px;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink);
  font: 13px Arial, sans-serif;
}

.search button {
  padding: 0 22px;
  border: none;
  background: var(--wine);
  color: white;
  cursor: pointer;
}

.layout {
  display: grid;
  grid-template-columns: 230px 1fr;
  gap: 28px;
}

.filters {
  padding: 8px 4px 18px 0;
  background: transparent;
  border: none;
  align-self: start;
}

.filters h2 {
  margin: 0 0 25px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
  color: var(--wine);
  font-size: 25px;
  font-weight: normal;
}

.filter-group {
  margin-bottom: 25px;
}

.filter-group label {
  display: block;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 14px;
}

.filter-group select {
  margin-bottom: 4px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 12px 5px;
  outline-color: var(--gold);
}

.reset {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--wine);
  background: transparent;
  color: var(--wine);
  cursor: pointer;
}

.reset:hover {
  background: var(--wine);
  color: white;
}

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.results-header h2 {
  color: var(--wine);
  font-weight: normal;
  font-size: 25px;
}

.count {
  color: var(--muted);
  font: 12px Arial, sans-serif;
}

.books {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.book {
  display: grid;
  grid-template-columns: 105px 1fr;
  gap: 15px;
  padding: 16px;
  background: var(--white);
  border: 1px solid var(--line);
}

.cover-link {
  display: block;
  min-width: 0;
}

.cover {
  min-height: 150px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: #e9dfd3;
  color: var(--wine);
  text-align: center;
  font-size: 19px;
  font-style: italic;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.cover.has-image {
  color: transparent;
}

.book small {
  color: var(--gold);
  font: 10px Arial, sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.book h3 {
  margin: 9px 0 5px;
  color: var(--wine);
  font-size: 20px;
  font-weight: normal;
}

.book h3 a:hover {
  text-decoration: underline;
}

.author {
  color: var(--muted);
  font: 12px Arial, sans-serif;
}

.description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.tag {
  padding: 5px 7px;
  background: #f0e8df;
  color: var(--wine);
  font: 10px Arial, sans-serif;
}

.empty {
  grid-column: 1 / -1;
  padding: 40px;
  background: var(--white);
  text-align: center;
  color: var(--muted);
}

footer {
  padding: 30px;
  background: var(--ink);
  color: #e9dfd5;
  text-align: center;
  font-size: 13px;
}

@media(max-width: 750px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .books {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 450px) {
  .site-header {
    padding: 45px 12px 0;
  }

  .account-area {
    top: 10px;
    right: 12px;
    left: 12px;
    font-size: 11px;
  }

  .profile-thumbnail,
  .profile-initial {
    width: 30px;
    height: 30px;
  }

  .book {
    grid-template-columns: 85px 1fr;
  }

  .hero {
    padding: 22px 15px 25px;
  }

  .hero h1 {
    font-size: 32px;
  }

  nav {
    gap: 13px;
    padding: 10px;
  }

  .search {
    flex-direction: column;
  }

  .search button {
    padding: 13px;
  }
}
</style>
</head>

<body>

<div class="site-header">

  <div class="account-area" id="account-area">

    <div id="guest-account">
      <a class="account-link" href="login.html">Iniciar sesión</a>
      <a class="account-link account-register" href="registro.html">Crear cuenta</a>
    </div>

    <div id="user-account">
      <a href="perfil.html" class="profile-link">
        <img
          id="profile-thumbnail"
          class="profile-thumbnail"
          src=""
          alt="Foto de perfil"
          style="display:none;"
        >
        <span id="profile-initial" class="profile-initial"></span>
        <span id="profile-name"></span>
      </a>
    </div>

  </div>

</div>

<nav id="main-navigation">
  <a href="index.html" data-page="index.html">Inicio</a>
  <a href="historias.html" data-page="historias.html">Biblioteca</a>
  <a href="categorias.html" data-page="categorias.html">Categorías</a>
  <a href="comunidad.html" data-page="comunidad.html">Comunidad</a>
  <a href="destacadas.html" data-page="destacadas.html">Destacadas</a>
  <a href="publicar.html" data-page="publicar.html">Publicar</a>
  <a href="nosotros.html" data-page="nosotros.html">Nosotros</a>
</nav>

<div class="hero">
  <h1>La biblioteca</h1>
  <p>Encuentra una historia que merezca quedarse contigo.</p>
</div>

<main>

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="Buscar por título o autor..."
    >
    <button onclick="filterBooks()">Buscar</button>
  </div>

  <div class="layout">

    <aside class="filters">
      <h2>Explorar</h2>

      <div class="filter-group">
        <label for="genre">Género</label>
        <select id="genre">
          <option value="">Todos los géneros</option>
        </select>
      </div>

      <button class="reset" onclick="resetFilters()">
        Limpiar filtros
      </button>
    </aside>

    <section>
      <div class="results-header">
        <h2>Catálogo</h2>
        <span class="count" id="count"></span>
      </div>

      <div class="books" id="books">
        <div class="empty">Cargando historias...</div>
      </div>
    </section>

  </div>
</main>

<footer>
  Universo Entre Líneas
  <p>Un lugar para cada historia.</p>
</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- NAVEGACIÓN -->

<script>
(function updateNavigation() {
  const currentPage = window.location.pathname
    .split("/")
    .pop()
    .toLowerCase() || "index.html";

  document.querySelectorAll(
    "#main-navigation a[data-page]"
  ).forEach(link => {
    if (link.dataset.page.toLowerCase() === currentPage) {
      link.style.display = "none";
    }
  });
})();
</script>

<!-- BIBLIOTECA DINÁMICA -->

<script>

const db = window.supabaseClient;

const booksContainer = document.getElementById("books");
const count = document.getElementById("count");
const genreSelect = document.getElementById("genre");

let stories = [];
let availableGenres = [];
let selectedGenreFromUrl = "";


// ======================================
// CARGAR HISTORIAS Y CATEGORÍAS
// ======================================

async function loadStories() {

  if (!db) {
    showMessage("No se pudo conectar con la base de datos.");
    return;
  }

  booksContainer.innerHTML =
    '<div class="empty">Cargando historias...</div>';

  // Cargar todas las categorías disponibles,
  // aunque todavía no tengan historias asignadas.

  const { data: allCategories, error: allCategoriesError } = await db
    .from("categories")
    .select("id, name")
    .order("name", { ascending: true });

  if (allCategoriesError) {
    console.error("Error al cargar todas las categorías:", allCategoriesError);
    availableGenres = [];
  } else {
    availableGenres = allCategories || [];
  }

  populateGenres();

  // Cargar historias publicadas.

  const { data: storyData, error: storyError } = await db
    .from("stories")
    .select(`
      id,
      author_id,
      title,
      synopsis,
      cover_url,
      status,
      content_rating,
      created_at
    `)
    .eq("status", "published")
    .order("created_at", { ascending: false });

  if (storyError) {
    console.error("Error al cargar las historias:", storyError);
    showMessage("No se pudieron cargar las historias. Inténtalo más tarde.");
    return;
  }

  if (!storyData || storyData.length === 0) {
    stories = [];
    filterBooks();
    return;
  }

  const authorIds = [
    ...new Set(storyData.map(story => story.author_id))
  ];

  const storyIds = storyData.map(story => story.id);

  // Cargar autores.

  const { data: profiles, error: profilesError } = await db
    .from("profiles")
    .select("id, username, display_name")
    .in("id", authorIds);

  if (profilesError) {
    console.error("Error al cargar autores:", profilesError);
  }

  const profileMap = new Map();

  (profiles || []).forEach(profile => {
    profileMap.set(profile.id, profile);
  });

  // Cargar relaciones entre historias y categorías.

  const { data: relations, error: relationsError } = await db
    .from("story_categories")
    .select("story_id, category_id")
    .in("story_id", storyIds);

  if (relationsError) {
    console.error("Error al cargar las categorías de las historias:", relationsError);
  }

  const categoryIds = [
    ...new Set((relations || []).map(item => item.category_id))
  ];

  let categories = [];

  if (categoryIds.length > 0) {

    const { data: categoryData, error: categoryError } = await db
      .from("categories")
      .select("id, name")
      .in("id", categoryIds);

    if (categoryError) {
      console.error("Error al consultar categorías:", categoryError);
    } else {
      categories = categoryData || [];
    }
  }

  const categoryMap = new Map();

  categories.forEach(category => {
    categoryMap.set(category.id, category.name);
  });

  const categoriesByStory = new Map();

  (relations || []).forEach(relation => {

    const categoryName = categoryMap.get(relation.category_id);

    if (!categoryName) return;

    if (!categoriesByStory.has(relation.story_id)) {
      categoriesByStory.set(relation.story_id, []);
    }

    categoriesByStory.get(relation.story_id).push(categoryName);
  });

  // Unir los datos.

  stories = storyData.map(story => {

    const profile = profileMap.get(story.author_id);

    const author =
      profile?.display_name ||
      profile?.username ||
      "Autor anónimo";

    return {
      ...story,
      author,
      genres: categoriesByStory.get(story.id) || []
    };
  });

  filterBooks();
}


// ======================================
// CARGAR GÉNEROS EN EL FILTRO
// ======================================

function populateGenres() {

  genreSelect.innerHTML =
    '<option value="">Todos los géneros</option>';

  availableGenres.forEach(category => {

    const option = document.createElement("option");

    option.value = category.name;
    option.textContent = category.name;

    genreSelect.appendChild(option);
  });

  if (selectedGenreFromUrl) {

    const matchingOption = Array.from(genreSelect.options).find(option =>
      option.value.toLowerCase() === selectedGenreFromUrl.toLowerCase()
    );

    if (matchingOption) {
      genreSelect.value = matchingOption.value;
    }
  }
}


// ======================================
// MOSTRAR LAS HISTORIAS
// ======================================

function renderBooks(list) {

  booksContainer.innerHTML = "";

  count.textContent = list.length +
    (list.length === 1 ? " historia" : " historias");

  if (list.length === 0) {
    showMessage("No encontramos historias con esos criterios.");
    return;
  }

  list.forEach(story => {

    const article = document.createElement("article");
    article.className = "book";

    // Portada.

    const coverLink = document.createElement("a");
    coverLink.className = "cover-link";
    coverLink.href =
      "historia.html?id=" + encodeURIComponent(story.id);

    const cover = document.createElement("div");
    cover.className = "cover";

    if (story.cover_url) {

      cover.style.backgroundImage =
        `url("${story.cover_url.replace(/"/g, "%22")}")`;

      cover.classList.add("has-image");

      cover.setAttribute("role", "img");
      cover.setAttribute("aria-label", "Portada de " + story.title);

    } else {

      cover.textContent = story.title;
    }

    coverLink.appendChild(cover);

    // Información.

    const content = document.createElement("div");

    const type = document.createElement("small");
    type.textContent = "Obra publicada";

    const title = document.createElement("h3");
    const link = document.createElement("a");

    link.href =
      "historia.html?id=" + encodeURIComponent(story.id);

    link.textContent = story.title;

    title.appendChild(link);

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = "Por " + story.author;

    const description = document.createElement("p");
    description.className = "description";

    description.textContent =
      story.synopsis || "Esta historia todavía no tiene una sinopsis.";

    const tags = document.createElement("div");
    tags.className = "tags";

    story.genres.forEach(genre => {

      const tag = document.createElement("span");

      tag.className = "tag";
      tag.textContent = genre;

      tags.appendChild(tag);
    });

    content.append(type, title, author, description, tags);

    article.append(coverLink, content);

    booksContainer.appendChild(article);
  });
}


// ======================================
// MOSTRAR MENSAJES
// ======================================

function showMessage(message) {

  booksContainer.innerHTML = "";

  const empty = document.createElement("div");

  empty.className = "empty";
  empty.textContent = message;

  booksContainer.appendChild(empty);

  count.textContent = "";
}


// ======================================
// FILTRAR HISTORIAS
// ======================================

function filterBooks() {

  const query = document.getElementById("search")
    .value.toLowerCase().trim();

  const genre = genreSelect.value;

  const filtered = stories.filter(story => {

    const matchesQuery =
      story.title.toLowerCase().includes(query) ||
      story.author.toLowerCase().includes(query);

    const matchesGenre =
      !genre || story.genres.includes(genre);

    return matchesQuery && matchesGenre;
  });

  renderBooks(filtered);
}


// ======================================
// LIMPIAR FILTROS
// ======================================

function resetFilters() {

  document.getElementById("search").value = "";
  genreSelect.value = "";

  filterBooks();
}


// ======================================
// ACTIVAR LOS FILTROS
// ======================================

["search", "genre"].forEach(id => {

  document.getElementById(id).addEventListener(
    "input",
    filterBooks
  );
});


// ======================================
// LEER EL GÉNERO DESDE LA DIRECCIÓN WEB
// ======================================

const parameters = new URLSearchParams(window.location.search);

selectedGenreFromUrl = parameters.get("genero") || "";


// ======================================
// INICIAR BIBLIOTECA
// ======================================

loadStories();

</script>

<!-- ACCESO A LA CUENTA Y PERFIL -->

<script>
(async function loadAccount() {

  const db = window.supabaseClient;

  const accountArea = document.getElementById("account-area");
  const guestAccount = document.getElementById("guest-account");
  const userAccount = document.getElementById("user-account");
  const profileName = document.getElementById("profile-name");
  const profileThumbnail = document.getElementById("profile-thumbnail");
  const profileInitial = document.getElementById("profile-initial");

  if (!db) {

    console.error("No se pudo conectar con Supabase.");

    guestAccount.style.display = "block";
    userAccount.style.display = "none";
    accountArea.style.visibility = "visible";

    return;
  }

  async function updateAccount(session) {

    if (!session || !session.user) {

      guestAccount.style.display = "block";
      userAccount.style.display = "none";

      return;
    }

    const user = session.user;

    const { data: profile, error } = await db
      .from("profiles")
      .select("username, display_name, avatar_url")
      .eq("id", user.id)
      .maybeSingle();

    if (error) {
      console.error("Error al cargar el perfil:", error);
    }

    const name =
      profile?.display_name ||
      profile?.username ||
      user.email?.split("@")[0] ||
      "Mi perfil";

    profileName.textContent = name;

    const initial = name.trim().charAt(0).toUpperCase() || "U";

    profileInitial.textContent = initial;

    if (profile?.avatar_url) {

      profileThumbnail.src = profile.avatar_url;
      profileThumbnail.style.display = "block";
      profileInitial.style.display = "none";

      profileThumbnail.onerror = function() {
        profileThumbnail.style.display = "none";
        profileInitial.style.display = "flex";
      };

    } else {

      profileThumbnail.style.display = "none";
      profileInitial.style.display = "flex";
    }

    guestAccount.style.display = "none";
    userAccount.style.display = "flex";
  }

  const { data: { session }, error } = await db.auth.getSession();

  if (error) {
    console.error("Error al comprobar la sesión:", error);
  }

  await updateAccount(session);

  accountArea.style.visibility = "visible";

  db.auth.onAuthStateChange((_event, session) => {
    updateAccount(session);
  });

})();
</script>
