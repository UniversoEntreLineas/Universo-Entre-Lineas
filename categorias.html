
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorías | Universo Entre Líneas</title>

<style>
:root {
  --paper: #F7F1E8;
  --wine: #713847;
  --dark: #4d2934;
  --beige: #D8C8B8;
  --gold: #B69A70;
  --white: #FFFCF7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: #30272C;
  font-family: Georgia, serif;
}

a {
  color: inherit;
}

/* CABECERA Y NAVEGACIÓN */

.site-header {
  position: relative;
  padding: 45px 15px 0;
  background: var(--dark);
}

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
  padding: 10px 16px;
  background: var(--dark);
  font-family: Arial, sans-serif;
  font-size: 13px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  transition: color .2s;
}

nav a:hover {
  color: var(--gold);
}

/* ACCESO A LA CUENTA */

.account-area {
  position: absolute;
  top: 12px;
  right: 25px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  font: 12px Arial, sans-serif;
  visibility: hidden;
}

.account-link {
  color: var(--white);
  font-weight: bold;
}

.account-register {
  padding: 7px 11px;
  border: 1px solid var(--beige);
}

.account-register:hover {
  background: var(--white);
  color: var(--dark);
}

.profile-link {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--white);
  font-weight: bold;
  text-decoration: none;
}

.profile-thumbnail {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--gold);
  background: #e9dfd3;
}

.profile-initial {
  width: 32px;
  height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--paper);
  color: var(--wine);
  font: bold 14px Arial, sans-serif;
}

#user-account {
  display: none;
}

/* CONTENIDO */

main {
  max-width: 1100px;
  margin: auto;
  padding: 45px 25px 55px;
}

.intro {
  text-align: center;
  margin-bottom: 45px;
}

.intro h2 {
  color: var(--wine);
  font-size: 32px;
  font-weight: normal;
}

.intro p {
  color: #75636A;
  line-height: 1.8;
}

.family {
  margin-bottom: 48px;
}

.family-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--beige);
}

.family-header h3 {
  color: var(--wine);
  font-size: 25px;
  font-weight: normal;
  margin: 0;
}

.family-header span {
  color: #927E78;
  font-size: 13px;
  font-style: italic;
}

.categories {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.category {
  display: block;
  padding: 20px;
  background: #FFFCF7;
  border: 1px solid var(--beige);
  text-decoration: none;
  color: var(--dark);
  transition: 0.2s;
}

.category:hover {
  border-color: var(--wine);
  transform: translateY(-3px);
  background: #FFFDFB;
}

.category h4 {
  color: var(--wine);
  font-size: 18px;
  font-weight: normal;
  margin: 0;
}

.category::after {
  content: "Explorar historias →";
  display: block;
  color: #927E78;
  font-size: 12px;
  margin-top: 10px;
}

.category:hover::after {
  color: var(--gold);
}

footer {
  text-align: center;
  padding: 30px 15px;
  border-top: 1px solid var(--beige);
  color: #75636A;
  font-size: 13px;
}

/* ADAPTACIÓN A MÓVILES */

@media (max-width: 600px) {
  nav {
    gap: 13px;
    padding: 10px;
  }

  .site-header {
    padding: 45px 12px 0;
  }

  .account-area {
    top: 10px;
    right: 12px;
    left: 12px;
    font-size: 11px;
  }

  .profile-thumbnail,
  .profile-initial {
    width: 30px;
    height: 30px;
  }

  main {
    padding: 35px 18px 45px;
  }

  .intro {
    margin-bottom: 35px;
  }

  .intro h2 {
    font-size: 27px;
  }

  .family-header {
    align-items: baseline;
    flex-wrap: wrap;
  }

  .family-header h3 {
    font-size: 23px;
  }

  .categories {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="site-header">

  <div class="account-area" id="account-area">

    <div id="guest-account">
      <a class="account-link" href="login.html">Iniciar sesión</a>
      <a class="account-link account-register" href="registro.html">Crear cuenta</a>
    </div>

    <div id="user-account">
      <a href="perfil.html" class="profile-link">
        <img
          id="profile-thumbnail"
          class="profile-thumbnail"
          src=""
          alt="Foto de perfil"
          style="display:none;"
        >
        <span id="profile-initial" class="profile-initial"></span>
        <span id="profile-name"></span>
      </a>
    </div>

  </div>

</div>

<nav>
  <a href="index.html">Inicio</a>
  <a href="historias.html">Biblioteca</a>
  <a href="categorias.html">Categorías</a>
  <a href="comunidad.html">Comunidad</a>
  <a href="destacadas.html">Destacadas</a>
  <a href="publicar.html">Publicar</a>
  <a href="nosotros.html">Nosotros</a>
</nav>

<main>

  <section class="intro">
    <h2>Explora por categorías</h2>
    <p>
      Cada historia pertenece a un universo diferente.
      Encuentra el género que más te guste y descubre nuevas lecturas.
    </p>
  </section>

  <div id="categoryFamilies"></div>

</main>

<footer>
  Universo Entre Líneas · Un lugar para cada historia
</footer>

<script>

const genreFamilies = [

  {
    name: "Romance",
    description: "Historias de amor y sentimientos.",
    genres: [
      "Romance",
      "Romance contemporáneo",
      "Romance histórico",
      "Romance paranormal",
      "Romance oscuro",
      "Romance juvenil",
      "Romance fantástico"
    ]
  },

  {
    name: "Fantasía",
    description: "Mundos mágicos y criaturas extraordinarias.",
    genres: [
      "Fantasía",
      "Fantasía épica",
      "Fantasía urbana",
      "Fantasía oscura",
      "Alta fantasía",
      "Baja fantasía",
      "Cuentos de hadas"
    ]
  },

  {
    name: "Ciencia ficción",
    description: "Tecnología, futuros posibles y otros mundos.",
    genres: [
      "Ciencia ficción",
      "Ciencia ficción espacial",
      "Cyberpunk",
      "Steampunk",
      "Distopía",
      "Utopía"
    ]
  },

  {
    name: "Misterio y crimen",
    description: "Secretos, investigaciones y verdades ocultas.",
    genres: [
      "Misterio",
      "Policial",
      "Novela negra",
      "Thriller",
      "Suspense",
      "Crimen y detectives"
    ]
  },

  {
    name: "Terror y sobrenatural",
    description: "Lo inexplicable, lo oscuro y lo inquietante.",
    genres: [
      "Terror",
      "Terror psicológico",
      "Terror sobrenatural",
      "Gótico",
      "Paranormal",
      "Sobrenatural"
    ]
  },

  {
    name: "Drama y emociones",
    description: "Conflictos, pérdidas y experiencias humanas.",
    genres: [
      "Drama",
      "Tragedia",
      "Drama psicológico",
      "Melodrama",
      "Vida cotidiana"
    ]
  },

  {
    name: "Aventura y acción",
    description: "Desafíos, viajes y grandes experiencias.",
    genres: [
      "Aventura",
      "Acción",
      "Supervivencia",
      "Viajes",
      "Artes marciales"
    ]
  },

  {
    name: "Historia y mitología",
    description: "Épocas pasadas, leyendas y personajes históricos.",
    genres: [
      "Histórico",
      "Mitología",
      "Retelling mitológico",
      "Biográfico"
    ]
  },

  {
    name: "Humor y juventud",
    description: "Crecimiento, humor y experiencias juveniles.",
    genres: [
      "Comedia",
      "Humor",
      "Sátira",
      "Juvenil",
      "Coming of Age (crecimiento personal)"
    ]
  },

  {
    name: "Literatura y otros",
    description: "Otras formas de narrar y experimentar con las palabras.",
    genres: [
      "Poesía",
      "Cuento",
      "Novela",
      "Fábula",
      "Erótico",
      "Experimental"
    ]
  }

];

const container = document.getElementById("categoryFamilies");

genreFamilies.forEach(family => {

  const section = document.createElement("section");
  section.className = "family";

  const heading = document.createElement("div");
  heading.className = "family-header";

  const title = document.createElement("h3");
  title.textContent = family.name;

  const description = document.createElement("span");
  description.textContent = family.description;

  heading.appendChild(title);
  heading.appendChild(description);

  const grid = document.createElement("div");
  grid.className = "categories";

  family.genres.forEach(genre => {

    const link = document.createElement("a");
    link.className = "category";

    const params = new URLSearchParams();
    params.set("genero", genre);

    link.href = "historias.html?" + params.toString();

    const name = document.createElement("h4");
    name.textContent = genre;

    link.appendChild(name);
    grid.appendChild(link);

  });

  section.appendChild(heading);
  section.appendChild(grid);

  container.appendChild(section);

});

</script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- ACCESO A LA CUENTA Y PERFIL -->

<script>
(async function loadAccount() {

  const db = window.supabaseClient;

  const accountArea = document.getElementById("account-area");
  const guestAccount = document.getElementById("guest-account");
  const userAccount = document.getElementById("user-account");
  const profileName = document.getElementById("profile-name");
  const profileThumbnail = document.getElementById("profile-thumbnail");
  const profileInitial = document.getElementById("profile-initial");

  if (!db) {
    console.error("No se pudo conectar con Supabase.");

    guestAccount.style.display = "block";
    userAccount.style.display = "none";
    accountArea.style.visibility = "visible";
    return;
  }

  async function updateAccount(session) {

    if (!session || !session.user) {
      guestAccount.style.display = "block";
      userAccount.style.display = "none";
      return;
    }

    const user = session.user;

    const { data: profile, error } = await db
      .from("profiles")
      .select("username, display_name, avatar_url")
      .eq("id", user.id)
      .maybeSingle();

    if (error) {
      console.error("Error al cargar el perfil:", error);
    }

    const name =
      profile?.display_name ||
      profile?.username ||
      user.email?.split("@")[0] ||
      "Mi perfil";

    profileName.textContent = name;

    const initial = name.trim().charAt(0).toUpperCase() || "U";
    profileInitial.textContent = initial;

    if (profile?.avatar_url) {
      profileThumbnail.src = profile.avatar_url;
      profileThumbnail.style.display = "block";
      profileInitial.style.display = "none";

      profileThumbnail.onerror = function() {
        profileThumbnail.style.display = "none";
        profileInitial.style.display = "flex";
      };
    } else {
      profileThumbnail.style.display = "none";
      profileInitial.style.display = "flex";
    }

    guestAccount.style.display = "none";
    userAccount.style.display = "flex";
  }

  const { data: { session }, error } = await db.auth.getSession();

  if (error) {
    console.error("Error al comprobar la sesión:", error);
  }

  await updateAccount(session);

  accountArea.style.visibility = "visible";

  db.auth.onAuthStateChange((_event, session) => {
    updateAccount(session);
  });

})();
</script>

</body>
</html>
